name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install pyinstaller pywebview pypdf
      - name: Check source syntax
        run: python -m py_compile desktop.py server.py
      - name: Build desktop application
        run: python -m PyInstaller --clean --noconfirm EmberTable.spec
      - name: Install installer compiler
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer exists
        shell: pwsh
        run: |
          if (!(Test-Path 'installer-output\EmberTable-Setup.exe')) { throw 'Installer missing' }
          Get-FileHash 'installer-output\EmberTable-Setup.exe' -Algorithm SHA256 | Format-List | Out-File 'installer-output\SHA256.txt'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EmberTable-Windows-Installer
          path: installer-output/*
          if-no-files-found: error
