<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline rulebook reader</title><style>body{margin:0;background:#101a13;color:#dedecf;font:13px Arial}header{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#1e3023;border-bottom:1px solid #506343}button,input,select{background:#2d4331;color:#f2e4ba;border:1px solid #6c7a58;border-radius:4px;padding:7px;font:inherit}button{cursor:pointer}input{width:55px}#surface{overflow:auto;text-align:center;min-height:500px;padding:10px}canvas{display:block;margin:auto;box-shadow:0 4px 20px #0007;background:#fff}#message{padding:14px;text-align:center;color:#b9c9a7}#outline{max-width:250px}a{color:#e1bd78}</style></head><body><header><button id="previous" aria-label="Previous page">←</button><label>Page <input id="pageNumber" type="number" min="1" value="1"></label><span id="pageCount"></span><button id="next" aria-label="Next page">→</button><label>Zoom <select id="zoom"><option value=".75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><select id="outline" aria-label="Book contents"><option>Contents</option></select><a id="download" download>Save PDF</a></header><div id="message" role="status">Opening your local rulebook…</div><div id="surface"><canvas id="pdfcanvas" aria-label="Rulebook page"></canvas></div><script type="module" src="reader.js"></script></body></html>
