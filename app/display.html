<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember Table · Player Display</title><style>body{margin:0;background:#080d0a;color:#d7b471;font:16px Georgia;text-align:center}header{padding:12px;display:flex;justify-content:space-around}canvas{display:block;max-width:100%;max-height:calc(100vh - 70px);margin:auto;object-fit:contain}button{background:#263f2e;border:1px solid #657954;color:#eddfbf;padding:7px;cursor:pointer}</style></head><body><header><span id="title">Ember Table</span><span id="round"></span><button onclick="document.documentElement.requestFullscreen?.()">Fullscreen</button></header><canvas id="displaymap" aria-label="Player battle map"></canvas><script src="map-render.js"></script><script>
let data=null;async function refresh(){try{const r=await fetch('/api/display');if(!r.ok)return;data=await r.json();document.getElementById('title').textContent=data.name;document.getElementById('round').textContent='Round '+data.round;if(data.map)EmberMap.draw(document.getElementById('displaymap'),data.map,{player:true,redraw:()=>EmberMap.draw(document.getElementById('displaymap'),data.map,{player:true})})}catch{}}refresh();setInterval(refresh,900);
</script></body></html>
