<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember Table · Player Display</title><style>body{margin:0;background:#080d0a;color:#d7b471;font:16px Georgia;text-align:center;overflow:hidden}header{padding:10px;display:flex;gap:12px;align-items:center;justify-content:center;opacity:.15;transition:opacity .2s;position:absolute;z-index:2;left:0;right:0;background:#0d1b15e8}header:hover,header:focus-within{opacity:1}canvas{display:block;width:100vw;height:100vh;object-fit:contain;margin:auto;transition:transform .2s}button,select,input{background:#263f2e;border:1px solid #657954;color:#eddfbf;padding:7px;cursor:pointer}body.black canvas,body.black #title,body.black #round{visibility:hidden}body.black{background:#000}#offline{position:absolute;bottom:10px;left:10px;color:#d9a16e}</style></head><body><header><span id="title">Ember Table</span><span id="round"></span><button onclick="fullscreen()">Fullscreen (F11)</button><button onclick="document.body.classList.toggle('black')">Black screen</button><label>Rotate <select onchange="rotation=+this.value;transform()"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><label>Scale <input aria-label="TV map scale" type="range" min="0.5" max="2" step="0.05" value="1" oninput="scale=+this.value;transform()"></label></header><canvas id="displaymap" aria-label="Player battle map"></canvas><span id="offline" role="status"></span><script src="map-geometry.js"></script><script src="map-art.js"></script><script src="map-catalog.js"></script><script src="token-templates.js"></script><script src="map-render.js"></script><script>
let data=null,rotation=0,scale=1,last='';function transform(){document.getElementById('displaymap').style.transform=`rotate(${rotation}deg) scale(${scale})`}function fullscreen(){if(window.pywebview?.api?.fullscreen)window.pywebview.api.fullscreen();else if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}document.addEventListener('keydown',e=>{if(e.key==='F11'){e.preventDefault();fullscreen()}if(e.key==='Escape'&&window.pywebview?.api?.fullscreen)window.pywebview.api.fullscreen()});async function refresh(){try{const r=await fetch('/api/display');if(!r.ok)throw Error();const raw=await r.text();document.getElementById('offline').textContent='';if(raw===last)return;last=raw;data=JSON.parse(raw);document.getElementById('title').textContent=data.name;document.getElementById('round').textContent='Round '+data.round;if(data.map)EmberMap.draw(document.getElementById('displaymap'),data.map,{player:true,redraw:()=>EmberMap.draw(document.getElementById('displaymap'),data.map,{player:true})});else{const c=document.getElementById('displaymap');c.getContext('2d').clearRect(0,0,c.width,c.height)}}catch{document.getElementById('offline').textContent='Waiting for Ember Table…'}}refresh();setInterval(refresh,900);
</script></body></html>
