<!doctype html><html><head><meta charset="utf-8"><title>Ember Table · Dice</title><style>body{margin:0;background:#14261e;color:#ead8b2;font:17px system-ui}main{padding:20px}canvas{width:100%;height:310px;background:#101b15;border-radius:16px}button,input{font:inherit;padding:10px;margin:4px;border-radius:7px;border:1px solid #9b8659}button{background:#d7b471;color:#17241c;cursor:pointer}#outcome{min-height:55px;text-align:center;font-size:24px}.muted{font-size:14px;color:#b7c4b3}#obsURL{width:90%}</style></head><body><main><h1>Ember dice</h1><canvas id="tray" width="960" height="360"></canvas><div id="outcome">Ready to roll</div><input id="expr" aria-label="Dice expression" value="1d20"><button id="roll">Roll</button><div id="quick"></div><label><input id="broadcast" type="checkbox"> Broadcast this window’s rolls to OBS</label><p class="muted">Results and labels are shared only when broadcasting is enabled. Keep the main Ember Table window open.</p><button id="clear">Clear OBS overlay</button><p>OBS Browser Source URL:</p><input id="obsURL" readonly aria-label="OBS Browser Source URL"><p class="muted">1280 × 720 · 60 FPS · transparent background · fades after 15 seconds</p><p id="error" role="status"></p></main><script src="dice3d.js"></script><script src="dice-window.js"></script></body></html>
