<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="ember-table.ico"><title>Ember Table · Campaign workspace</title><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#"><img src="ember-table.png" width="42" height="42" alt=""> <span>EMBER TABLE<small>EVERY GREAT STORY STARTS HERE</small></span></a><label class="eyebrow">YOUR SEAT AT THE TABLE</label><div class="switch"><button id="dm">Dungeon Master</button><button id="player">Player</button></div><label class="eyebrow">CAMPAIGN</label><select id="campaignSelect" aria-label="Campaign"></select><nav id="nav"></nav><div class="sidebottom"><span class="dot"></span> Local files · automatic backups<p>Stored in the app’s data folder. Export backups before moving PCs.</p><button onclick="backup()">↓ Export workspace</button><button onclick="document.getElementById('restore').click()">↑ Restore backup</button><input hidden id="restore" type="file" accept="application/json"></div></aside><main><header><span id="crumb">WORKSPACE / OVERVIEW</span><div><button onclick="newCampaign()">＋ New campaign</button><button class="gold" onclick="openNote()">＋ Quick note</button></div></header><div id="view"></div><footer>Ember Table 0.6.1 · Your world. Your rules. <span>Independent tabletop companion</span></footer></main><dialog id="modal"><form id="form"><div id="fields"></div><div class="actions"><button type="button" onclick="modal.close()">Cancel</button><button class="gold" type="submit">Save</button></div></form></dialog><div id="toast" role="status"></div><div id="startup" role="status">Opening your local workspace…</div><script src="boot.js"></script></body></html>
